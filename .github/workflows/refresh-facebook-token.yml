name: Facebook Token Health Check

on:
  schedule:
    - cron: '0 10 1 * *'  # 1st of every month at 10:00 AM UTC
  workflow_dispatch:        # manual trigger

permissions:
  issues: write   # the failure issue below; the check itself needs no token

jobs:
  token-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Facebook Page Token
        run: |
          RESPONSE=$(curl -s "https://graph.facebook.com/debug_token?input_token=${{ secrets.FACEBOOK_PAGE_TOKEN }}&access_token=${{ secrets.FACEBOOK_PAGE_TOKEN }}")

          # Guard: a 5xx/timeout returns non-JSON, which would otherwise decode to
          # empty strings and be misdiagnosed as "token invalid". Fail with the real
          # cause instead.
          if ! echo "$RESPONSE" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "ERROR: Facebook API did not return JSON (API error/outage, not a token problem):"
            echo "$RESPONSE" | head -c 300
            exit 1
          fi

          IS_VALID=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('is_valid',''))" 2>/dev/null || echo "")
          EXPIRES_AT=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('expires_at',''))" 2>/dev/null || echo "")
          TOKEN_TYPE=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('type',''))" 2>/dev/null || echo "")
          ERROR=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',{}).get('message',''))" 2>/dev/null || echo "")

          echo "Token type   : $TOKEN_TYPE"
          echo "Is valid     : $IS_VALID"
          echo "Expires at   : $EXPIRES_AT"

          if [ -n "$ERROR" ]; then
            echo "ERROR: Facebook API returned an error: $ERROR"
            exit 1
          fi

          if [ "$IS_VALID" != "True" ]; then
            echo "ERROR: Token is no longer valid. Regenerate via /me/accounts and update FACEBOOK_PAGE_TOKEN secret."
            exit 1
          fi

          if [ "$TOKEN_TYPE" != "PAGE" ]; then
            echo "ERROR: Token type is '$TOKEN_TYPE', expected PAGE. Replace FACEBOOK_PAGE_TOKEN with a proper Page token."
            exit 1
          fi

          if [ "$EXPIRES_AT" != "0" ]; then
            echo "WARNING: Token has an expiry ($EXPIRES_AT). Should be 0 for a permanent Page token."
            exit 1
          fi

          echo "PASS: Page token is valid, permanent, and correctly typed."

      - name: Alert on token failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY=$(TZ=America/New_York date +%F)
          TITLE="⚠️ Facebook Page token check failed on ${DAY}"
          # If the listing fails, open the issue anyway. So too if a matching open
          # issue lies beyond the first 200 listed (--limit): it is missed and a
          # duplicate is opened, by policy better than a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this check: ${TITLE}"
            exit 0
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "The monthly Facebook Page token check failed. Facebook posting stops working when the token does." \
            "" \
            "Reported: ${REPORTED}" \
            "Run: ${RUN_URL}" \
            "" \
            "What to do: the run's \"Validate Facebook Page Token\" step says why: the token is invalid, not a Page token, has an expiry, or Facebook's API errored. For a token problem, regenerate it in Graph API Explorer (/me/accounts) and update the FACEBOOK_PAGE_TOKEN secret. For an API error, re-run the workflow later. Close this issue once a check passes." \
            "" \
            "_Auto-generated by refresh-facebook-token.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
