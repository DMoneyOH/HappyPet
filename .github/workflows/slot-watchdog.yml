name: Slot Watchdog

# Fires 4h after the Mon/Thu 12:00 UTC publish slot. If no dated post for
# today exists on main, the slot was missed: open one issue and send an email.
on:
  schedule:
    - cron: '0 16 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check for today's post
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          echo "today=${TODAY}" >> "$GITHUB_OUTPUT"
          if ls _posts/${TODAY}-*.md >/dev/null 2>&1; then
            echo "Post for ${TODAY} exists on main -- slot filled"
            echo "missing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "missing=true" >> "$GITHUB_OUTPUT"
          TITLE="slot-watchdog: no post published ${TODAY}"
          OPEN_COUNT=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${TITLE}\" in:title" --json number --jq length || echo 1)
          if [ "${OPEN_COUNT}" = "0" ]; then
            gh issue create --repo "${GITHUB_REPOSITORY}" \
              --title "${TITLE}" \
              --body "No _posts/${TODAY}-*.md exists on main after the scheduled publish slot. Check the Stage 1 / Stage 2 runs and the queue. _Auto-generated by slot-watchdog.yml_" || true
          else
            echo "Slot-watchdog issue already open -- not filing a duplicate"
          fi

      - name: Email alert
        if: steps.check.outputs.missing == 'true'
        env:
          GMAIL_SMTP_USER:    ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_ACCOUNT:      ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TODAY:              ${{ steps.check.outputs.today }}
          RUN_ID:             ${{ github.run_id }}
        run: |
          python3 -c "
          import smtplib, os
          from email.mime.text import MIMEText
          today   = os.environ.get('TODAY', '')
          run_id  = os.environ.get('RUN_ID', '')
          smtp_user  = os.environ.get('GMAIL_SMTP_USER', '')
          smtp_login = os.environ.get('GMAIL_ACCOUNT', '')
          smtp_pass  = os.environ.get('GMAIL_APP_PASSWORD', '')
          if not smtp_pass:
              print('GMAIL_APP_PASSWORD not set -- skipping alert'); exit(0)
          body = f'No post was published for {today}.\n\nRun ID: {run_id}\nLogs: https://github.com/DMoneyOH/HappyPet/actions/runs/{run_id}'
          msg = MIMEText(body)
          msg['Subject'] = f'[HappyPet] Slot watchdog: no post published {today}'
          msg['From']    = smtp_user
          msg['To']      = 'hello@happypetproductreviews.com'
          try:
              with smtplib.SMTP('smtp.gmail.com', 587) as s:
                  s.starttls(); s.login(smtp_login, smtp_pass)
                  s.sendmail(smtp_user, ['hello@happypetproductreviews.com'], msg.as_string())
              print('Alert email sent')
          except Exception as e:
              print(f'Alert email failed: {e}')
          "
