name: Slot Watchdog

# Runs 4 hours after the Mon/Thu 12:00 UTC publish slot (publish.yml's cron). If
# main holds no post dated that UTC day, the slot was missed: it opens one GitHub
# issue for the day, and GitHub's own notification email carries it. It reads main;
# it never writes to the repo or dispatches a workflow.
on:
  schedule:
    - cron: '0 16 * * 1,4'
  workflow_dispatch:
    inputs:
      date:
        description: 'Publish day to check, YYYY-MM-DD in UTC (blank = today)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Missed slot — create GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT_DATE: ${{ inputs.date }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY="${SLOT_DATE:-$(date -u +%F)}"
          if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! DOW=$(date -u -d "$DAY" +%u 2>/dev/null); then
            echo "::error::Not a YYYY-MM-DD date: ${DAY}"
            exit 1
          fi
          if [ "$DOW" != "1" ] && [ "$DOW" != "4" ]; then
            echo "${DAY} is not a publish day (Mon or Thu), so there is no slot to check"
            exit 0
          fi
          POSTS=$(compgen -G "_posts/${DAY}-*.md" || true)
          if [ -n "$POSTS" ]; then
            printf 'The %s slot is filled on main:\n%s\n' "$DAY" "$POSTS"
            exit 0
          fi
          WEEKDAY=$(date -u -d "$DAY" +%a)
          TITLE="⚠️ Missed publish slot: no post on main for ${WEEKDAY} ${DAY}"
          # One issue per missed day. If the listing fails, open the issue anyway. So
          # too if a matching open issue lies beyond the first 200 listed (--limit): it
          # is missed and a duplicate is opened, by policy better than a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this slot: ${TITLE}"
            exit 0
          fi
          SLOT_ET=$(TZ=America/New_York date -d "${DAY} 12:00 UTC" '+%-I:%M %p %Z')
          CHECKED_ET=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "The ${WEEKDAY} ${DAY} publish slot (12:00 UTC, ${SLOT_ET}) passed without a post: main has no \`_posts/${DAY}-*.md\`." \
            "" \
            "Checked: ${CHECKED_ET}" \
            "Watchdog run: ${RUN_URL}" \
            "" \
            "What to do:" \
            "1. Check whether the Stage 1 routine opened a stage1/ pull request today, and whether it merged: ${REPO_URL}/pulls?q=is%3Apr+head%3Astage1%2F" \
            "2. Check today's Stage 2 (publish.yml) runs for a failure: ${REPO_URL}/actions/workflows/publish.yml" \
            "3. Fix the cause, merge the draft or re-run publish.yml, then close this issue." \
            "" \
            "_Auto-generated by slot-watchdog.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
