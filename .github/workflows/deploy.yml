name: Deploy HappyPet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_posts/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.md'
      - 'assets/**'
      - '_layouts/**'
      - '_includes/**'
      - '_data/**'
      - '_config.yml'
      - 'Gemfile'
  workflow_dispatch:
  # NOTE: no workflow_run trigger. Stage 2's commit of the dated post already
  # matches the push filter above and fires this deploy once. A second
  # workflow_run trigger double-fired the deploy (and double-dispatched pins).

# Job-scoped where elevated: trigger-pins gets actions:write, deploy gets pages/id-token,
# report-failure gets issues:write
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-pins:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout to read pending-slugs
        uses: actions/checkout@v4

      - name: Dispatch Stage 3 if pending slugs exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PENDING="_pin_queue/.pending-slugs"
          if [ ! -f "$PENDING" ]; then
            echo "No .pending-slugs found — skipping pin dispatch"
            exit 0
          fi
          SLUGS=$(cat "$PENDING" | tr -d '[:space:]')
          if [ -z "$SLUGS" ]; then
            echo ".pending-slugs is empty — skipping pin dispatch"
            exit 0
          fi
          echo "Dispatching pin.yml for slugs: ${SLUGS}"
          gh workflow run pin.yml \
            --repo "${{ github.repository }}" \
            --field slugs="${SLUGS}"

  report-failure:
    # failure() is true when any job above failed, including when build failed
    # and deploy and trigger-pins were skipped because of it.
    needs: [build, deploy, trigger-pins]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Deploy failed — create GitHub issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PINS: ${{ needs.trigger-pins.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FAILED=()
          TODO=()
          if [ "$BUILD" = "failure" ]; then
            FAILED+=("build")
            TODO+=("- build: the Jekyll build failed, so the site was not updated and still serves the last good build. The build step's log names the file. Fix it on main; the next push rebuilds, or run deploy.yml by hand.")
          fi
          if [ "$DEPLOY" = "failure" ]; then
            FAILED+=("deploy")
            TODO+=("- deploy: the site built but GitHub Pages did not take it, so the site still serves the last good build. Re-run the failed job; if it fails again, check the repo's Pages settings.")
          fi
          if [ "$PINS" = "failure" ]; then
            FAILED+=("trigger-pins")
            TODO+=("- trigger-pins: the site deployed, but Stage 3 (pin.yml) was not dispatched, so the pins in _pin_queue/.pending-slugs did not go out. Run pin.yml by hand and leave slugs blank.")
          fi
          if [ "${#FAILED[@]}" -eq 0 ]; then
            FAILED+=("unknown job")
            TODO+=("- No job reported a failure result. Open the run to see what stopped it.")
          fi
          JOBS=$(IFS=','; echo "${FAILED[*]}")
          DAY=$(TZ=America/New_York date +%F)
          TITLE="⚠️ Deploy failed on ${DAY}: ${JOBS}"
          # One issue per day and failed-job set. If the listing fails, open the issue
          # anyway. So too if a matching open issue lies beyond the first 200 listed
          # (--limit): it is missed and a duplicate is opened, by policy better than
          # a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this deploy failure: ${TITLE}"
            exit 0
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "Deploy HappyPet to GitHub Pages (deploy.yml) failed in: ${JOBS}." \
            "" \
            "Trigger: ${TRIGGER}" \
            "Reported: ${REPORTED}" \
            "Run: ${RUN_URL}" \
            "" \
            "What to do:" \
            "${TODO[@]}" \
            "" \
            "Close this issue once a deploy run succeeds." \
            "" \
            "_Auto-generated by deploy.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
