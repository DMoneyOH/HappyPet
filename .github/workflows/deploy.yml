name: Deploy HappyPet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '_posts/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*.md'
      - 'assets/**'
      - '_layouts/**'
      - '_includes/**'
      - '_config.yml'
      - 'Gemfile'
  workflow_dispatch:
  # NOTE: no workflow_run trigger. Stage 2's commit of the dated post already
  # matches the push filter above and fires this deploy once. A second
  # workflow_run trigger double-fired the deploy (and double-dispatched pins).

# Job-scoped where elevated: trigger-pins gets actions:write, deploy gets pages/id-token
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-pins:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout to read pending-slugs
        uses: actions/checkout@v4

      - name: Dispatch Stage 3 if pending slugs exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PENDING="_pin_queue/.pending-slugs"
          if [ ! -f "$PENDING" ]; then
            echo "No .pending-slugs found — skipping pin dispatch"
            exit 0
          fi
          SLUGS=$(cat "$PENDING" | tr -d '[:space:]')
          if [ -z "$SLUGS" ]; then
            echo ".pending-slugs is empty — skipping pin dispatch"
            exit 0
          fi
          echo "Dispatching pin.yml for slugs: ${SLUGS}"
          gh workflow run pin.yml \
            --repo "${{ github.repository }}" \
            --field slugs="${SLUGS}"

  alert-on-failure:
    runs-on: ubuntu-latest
    needs: [build, deploy, trigger-pins]
    if: failure()
    permissions:
      contents: read
    steps:
      - name: Alert on failure
        env:
          GMAIL_SMTP_USER:    ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_ACCOUNT:      ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_ID:             ${{ github.run_id }}
        run: |
          python3 -c "
          import smtplib, os
          from email.mime.text import MIMEText
          run_id  = os.environ.get('RUN_ID', '')
          smtp_user  = os.environ.get('GMAIL_SMTP_USER', '')
          smtp_login = os.environ.get('GMAIL_ACCOUNT', '')
          smtp_pass  = os.environ.get('GMAIL_APP_PASSWORD', '')
          if not smtp_pass:
              print('GMAIL_APP_PASSWORD not set -- skipping alert'); exit(0)
          body = f'Deploy workflow failed.\n\nRun ID: {run_id}\nLogs: https://github.com/DMoneyOH/HappyPet/actions/runs/{run_id}'
          msg = MIMEText(body)
          msg['Subject'] = '[HappyPet] Deploy workflow failed'
          msg['From']    = smtp_user
          msg['To']      = 'hello@happypetproductreviews.com'
          try:
              with smtplib.SMTP('smtp.gmail.com', 587) as s:
                  s.starttls(); s.login(smtp_login, smtp_pass)
                  s.sendmail(smtp_user, ['hello@happypetproductreviews.com'], msg.as_string())
              print('Alert email sent')
          except Exception as e:
              print(f'Alert email failed: {e}')
          "
