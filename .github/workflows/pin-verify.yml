name: Pin outcome check

# Stage 3 (pin.yml) counts a pin as fired when the webhook service answers 2xx.
# That says the event was accepted, not that Pinterest made the pin: on 2026-11-02
# one board's applet failed, Stage 3 stayed green, and the pin never appeared.
#
# This workflow starts when Stage 3 finishes, waits for Pinterest to catch up, then
# reads each board's public RSS feed and confirms every pin Stage 3 fired is there
# (verify_pins.py explains how a pin is recognised). A pin that is not there, or a
# feed that cannot be read, opens one GitHub issue, and GitHub's notification email
# carries it, as for every other alert.
#
# It is a separate workflow so the pin job is not stretched by the wait (15 minutes,
# then one recheck after 15 more: the one hand-timed feed lag was under 3 minutes).
# It is triggered by pin.yml finishing rather than dispatched from inside it so
# pin.yml's token stays as narrow as it is. It reads the repo and opens issues: it
# fires nothing and writes no file in the repo.
on:
  workflow_run:
    workflows: ["Stage 3 — Post Pins"]
    types: [completed]
  workflow_dispatch:
    inputs:
      since:
        description: 'UTC time to look from, like 2026-11-05T12:00:00Z (blank = the last 3 hours)'
        required: false
        default: ''
      wait_minutes:
        description: 'Minutes to wait before the first feed read (0 to 30)'
        required: false
        default: '15'
      retry_wait_minutes:
        description: 'Minutes to wait before a pin that was not found is read again (0 to 30)'
        required: false
        default: '15'

permissions:
  contents: read
  issues: write

concurrency:
  group: happypet-pin-verify
  cancel-in-progress: false

jobs:
  verify:
    # A Stage 3 run that pinned or failed: either may have fired some boards.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Check each pin is on its board
        id: check
        # The check's own failure must not hide behind a red setup step, and its
        # alert must still run: the steps below act on this step's outcome.
        continue-on-error: true
        env:
          SINCE: ${{ github.event.workflow_run.run_started_at || inputs.since }}
          WAIT_MINUTES: ${{ inputs.wait_minutes || '15' }}
          RETRY_WAIT_MINUTES: ${{ inputs.retry_wait_minutes || '15' }}
        run: |
          python3 verify_pins.py --since "$SINCE" \
            --wait-minutes "$WAIT_MINUTES" --retry-wait-minutes "$RETRY_WAIT_MINUTES" \
            --out-dir pin-verify

      - name: Fail the run if the check found a problem
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The pin check found a pin that is not on its board, or could not check one. The issue it opened names which."
          exit 1

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY=$(TZ=America/New_York date +%F)
          KIND=$(cat pin-verify/kind 2>/dev/null || echo unchecked)
          SLUGS=$(cat pin-verify/slugs 2>/dev/null || true)
          if [ "$KIND" = "missing" ]; then
            TITLE="⚠️ Pin missing from its board on ${DAY}: ${SLUGS:-unknown slugs}"
          else
            TITLE="⚠️ Pin check could not run on ${DAY}: ${SLUGS:-unknown slugs}"
          fi
          DETAIL=$(cat pin-verify/body.md 2>/dev/null || echo "The check stopped before it wrote a report. No pin was confirmed or ruled out. The run log says why.")
          # One issue per day, kind and slug list. If the listing fails, open the
          # issue anyway. So too if a matching open issue lies beyond the first 200
          # listed (--limit): it is missed and a duplicate is opened, by policy
          # better than a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this: ${TITLE}"
            exit 0
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "${DETAIL}" \
            "" \
            "Reported: ${REPORTED}" \
            "Run: ${RUN_URL}" \
            "" \
            "_Auto-generated by pin-verify.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
