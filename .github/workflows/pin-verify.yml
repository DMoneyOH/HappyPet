name: Pin outcome check

# Stage 3 (pin.yml) counts a pin as fired when the webhook service answers 2xx.
# That says the event was accepted, not that Pinterest made the pin: on 2026-11-02
# one board's applet failed, Stage 3 stayed green, and the pin never appeared.
#
# Each run this workflow looks at the pins fired in the last 24 hours, reads each
# board's public RSS feed, and confirms every pin that is at least 30 minutes old is
# there (verify_pins.py explains how a pin is recognised and what it cannot see).
# A pin that is not there, or a feed that cannot be read, opens one GitHub issue,
# and GitHub's notification email carries it, as for every other alert.
#
# It runs on a schedule, not after pin.yml, on purpose. A trigger that fires "after
# another workflow" cannot be tested before merge, and if it never fired nothing
# would say so: a check that never starts looks exactly like a pass. A schedule
# needs no other workflow to behave and does not care how Stage 3 ended, provided its
# sentinels reached main. It examines each pin while the pin is 30 minutes to 24
# hours old. The cron asks for hourly runs, but GitHub ran them every 7 to 9 hours
# (November 2026); any gap up to 23.5 hours is bridged. The same
# schedule mechanism runs slot-watchdog.yml, whose last step opens an issue if this
# workflow has not run in 12 hours (it shares GitHub's scheduler, so it cannot catch a
# total outage of it). The limits and the accepted false alarms are in verify_pins.py.
#
# Read-only: it fires nothing and writes no file in the repo. There is no
# concurrency group on purpose: a shared group keeps one pending run and silently
# drops the rest, and two overlapping runs only repeat a read and meet at the
# open-issue check.
on:
  schedule:
    # Off the top of the hour, when scheduled runs are delayed most.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'UTC time to look from, like 2026-11-05T12:00:00Z, at most 24 hours back (blank = the last 24 hours)'
        required: false
        default: ''
      settle_minutes:
        description: 'A pin fired more recently than this is left to the next sweep (0 to 30)'
        required: false
        default: '30'
      retry_wait_minutes:
        description: 'Minutes to wait before a pin that was not found is read again (0 to 30; 0 re-reads at once)'
        required: false
        default: '15'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # The one wait is the retry wait, at most 30 minutes.
    timeout-minutes: 50

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Check each pin is on its board
        id: check
        # The check's own failure must not hide behind a red setup step, and its
        # alert must still run: the steps below act on this step's outcome.
        continue-on-error: true
        env:
          SINCE: ${{ inputs.since }}
          SETTLE_MINUTES: ${{ inputs.settle_minutes || '30' }}
          RETRY_WAIT_MINUTES: ${{ inputs.retry_wait_minutes || '15' }}
        run: |
          python3 verify_pins.py --since "$SINCE" \
            --settle-minutes "$SETTLE_MINUTES" --retry-wait-minutes "$RETRY_WAIT_MINUTES" \
            --out-dir LOGS/pin-verify

      - name: Fail the run if the check found a problem
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::The pin check found a pin that is not on its board, or could not check one. The issue it opened names which."
          exit 1

      - name: Open an issue
        # Also when the run was cancelled or timed out: a check that stopped
        # half-way must not read as a pass.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY=$(TZ=America/New_York date +%F)
          KIND=$(cat LOGS/pin-verify/kind 2>/dev/null || echo unchecked)
          SLUGS=$(cat LOGS/pin-verify/slugs 2>/dev/null || true)
          if [ "$KIND" = "missing" ]; then
            TITLE="⚠️ Pin missing from its board on ${DAY}: ${SLUGS:-unknown slugs}"
          else
            TITLE="⚠️ Could not check pins on ${DAY}: ${SLUGS:-unknown slugs}"
          fi
          DETAIL=$(cat LOGS/pin-verify/body.md 2>/dev/null || echo "The check stopped before it wrote a report: a step failed, or the run was cancelled or timed out. No pin was confirmed or ruled out. The run log says why.")
          # One issue per day, kind and slug list. If the listing fails, open the
          # issue anyway. So too if a matching open issue lies beyond the first 200
          # listed (--limit): it is missed and a duplicate is opened, by policy
          # better than a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this: ${TITLE}"
            exit 0
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "${DETAIL}" \
            "" \
            "Reported: ${REPORTED}" \
            "Run: ${RUN_URL}" \
            "" \
            "_Auto-generated by pin-verify.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
