name: Refill watchdog

# Dead-man's switch for the local refill run (refill automation step 3). Merging
# this file ARMS A CRON: it runs every Sunday and Wednesday and opens a GitHub
# issue (GitHub's notification email carries it) when the topic queue is about
# to run dry.
# Every decision lives in refill_watchdog.py (see its docstring). It reads; it never
# writes to the repo, never opens a PR, never dispatches a workflow; its only
# write is the alert issue.
#
# Sunday 20:00 UTC is after the biweekly Sunday refill run; Wednesday 20:00 UTC is
# before the Thursday 12:00 UTC publish. Either can be re-run by hand.
#
# Class-3 CI: needs the two-clone review before it merges.

on:
  schedule:
    - cron: '0 20 * * 0,3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: happypet-refill-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read        # checkout products.json and _posts/
      pull-requests: read   # count open refill/* PRs
      issues: write         # open the alert issue
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Count open refill PRs
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # One line of JSON, e.g. [] or [12,13] (tojson keeps it on one line for
          # GITHUB_OUTPUT). Fail closed: a failed read becomes "unreadable", which
          # the checker alerts on.
          if OPEN=$(gh pr list --repo "$REPO" --state open --search "head:refill/" \
                      --json number --jq 'map(.number) | tojson'); then
            echo "open=${OPEN}" >> "$GITHUB_OUTPUT"
          else
            echo "open=unreadable" >> "$GITHUB_OUTPUT"
          fi

      - name: Check queue depth (alerts and goes red when low)
        id: check
        env:
          OPEN_REFILL_PRS:    ${{ steps.prs.outputs.open }}
        run: python3 refill_watchdog.py

      - name: Queue low — create GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          BODY: ${{ steps.check.outputs.body }}
        run: |
          DAY=$(TZ=America/New_York date +%F)
          TITLE="⚠️ Refill watchdog ${DAY}: ${SUMMARY:-the queue check itself failed}"
          # One issue per day and cause; counts stay out of the title so a same-day
          # rerun finds the open issue. If the listing fails, open the issue anyway.
          # So too if a matching open issue lies beyond the first 200 listed (--limit):
          # it is missed and a duplicate is opened, by policy better than a lost alert.
          OPEN=$(gh issue list --repo "$REPO" --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for this alert: ${TITLE}"
            exit 0
          fi
          if [ -z "$BODY" ]; then
            BODY=$(printf '%s\n' \
              "The refill watchdog failed before it could report the queue depth." \
              "" \
              "Run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
              "" \
              "Read the run log, fix the cause, and re-run the workflow. Close this issue once a watchdog run passes.")
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          gh issue create \
            --repo "$REPO" \
            --title "$TITLE" \
            --body "$(printf '%s\n\nReported: %s\n\n_Auto-generated by refill-watchdog.yml_' "$BODY" "$REPORTED")" \
            --assignee DMoneyOH
