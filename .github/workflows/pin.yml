name: Stage 3 — Post Pins

on:
  # Single automatic path: deploy.yml dispatches this workflow (with slugs)
  # AFTER the site deploy succeeds -- that guarantees articles are live before
  # pins fire. The old direct workflow_run trigger on Stage 2 ran in parallel
  # with the deploy-dispatched run (no concurrency group), double-firing pins.
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated slugs to pin (leave empty to read from .pending-slugs)'
        required: false
        default: ''
      force:
        description: 'Pin slugs that were pinned before (true/false). A board that already has the same image is still refused; give the post a new image path first.'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: happypet-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "HappyPet Bot"
          git config user.email "hello@happypetproductreviews.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Resolve slugs
        id: resolve
        run: |
          # Manual trigger: use input if provided, else fall back to .pending-slugs
          # Automatic trigger (workflow_run): always read .pending-slugs
          INPUT_SLUGS="${{ github.event.inputs.slugs }}"
          PENDING="_pin_queue/.pending-slugs"

          if [ -n "$INPUT_SLUGS" ]; then
            SLUGS="$INPUT_SLUGS"
            echo "Slugs from workflow_dispatch input: ${SLUGS}"
          elif [ -f "$PENDING" ]; then
            SLUGS=$(cat "$PENDING")
            echo "Slugs from .pending-slugs: ${SLUGS}"
          else
            echo "No slugs from input or .pending-slugs — nothing to pin"
            echo "slugs=" >> "$GITHUB_OUTPUT"
            echo "nothing_to_pin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$SLUGS" ]; then
            echo "Empty slug list — nothing to pin"
            echo "slugs=" >> "$GITHUB_OUTPUT"
            echo "nothing_to_pin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "slugs=${SLUGS}" >> "$GITHUB_OUTPUT"
          echo "nothing_to_pin=false" >> "$GITHUB_OUTPUT"
          echo "Resolved slugs: ${SLUGS}"

      - name: Wait for article and image liveness
        id: liveness
        if: steps.resolve.outputs.nothing_to_pin != 'true'
        run: |
          SLUGS="${{ steps.resolve.outputs.slugs }}"
          IFS=',' read -ra SLUG_LIST <<< "$SLUGS"
          MAX_WAIT=1800
          POLL=30
          ELAPSED=0

          echo "Checking liveness for slugs: ${SLUGS}"
          sleep 30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_LIVE=true
            for slug in "${SLUG_LIST[@]}"; do
              slug=$(echo "$slug" | tr -d '[:space:]')
              PIN_JSON="_pin_queue/${slug}.json"
              if [ ! -f "$PIN_JSON" ]; then
                echo "  [${ELAPSED}s] ${slug}: JSON in sent/ — skipping liveness"
                continue
              fi
              ART_URL=$(python3 -c "import json; d=json.load(open('${PIN_JSON}')); print(d.get('article_url','').split('?')[0].rstrip('/')+'/')")
              IMG_URL=$(python3 -c "import json; d=json.load(open('${PIN_JSON}')); u=d.get('image_url','').split('?')[0]; print(u)")
              ART_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$ART_URL" || echo "000")
              IMG_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$IMG_URL" || echo "000")
              echo "  [${ELAPSED}s] ${slug}: article=${ART_CODE} image=${IMG_CODE}"
              if [ "$ART_CODE" != "200" ] || [ "$IMG_CODE" != "200" ]; then
                ALL_LIVE=false
              fi
            done
            if [ "$ALL_LIVE" = "true" ]; then
              echo "All articles and images confirmed live at ${ELAPSED}s"
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $POLL
            ELAPSED=$(( ELAPSED + POLL ))
          done

          echo "ERROR: Liveness timeout after ${MAX_WAIT}s — aborting pin fire"
          echo "live=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Post pins via IFTTT Maker webhooks
        id: post
        if: steps.resolve.outputs.nothing_to_pin != 'true'
        # post_pins.py exits 1 on a failed or missing pin, and 6 when it refused a
        # repeat (that image already went out on that board; nothing to retry).
        # The code is kept as the `rc` output so the steps below can say which.
        # continue-on-error lets the Sheets and consume steps below still run; the
        # assert step after them fails the job on this step's outcome, so the
        # alert issue opens.
        continue-on-error: true
        env:
          IFTTT_MAKER_KEY:          ${{ secrets.IFTTT_MAKER_KEY }}
          GCP_SA_KEY_B64:           ${{ secrets.GCP_SA_KEY_B64 }}
          HAPPYPET_SHEET_ID_DOGS:   ${{ secrets.HAPPYPET_SHEET_ID_DOGS }}
          HAPPYPET_SHEET_ID_CATS:   ${{ secrets.HAPPYPET_SHEET_ID_CATS }}
          HAPPYPET_SHEET_ID_HOME:   ${{ secrets.HAPPYPET_SHEET_ID_HOME }}
          HAPPYPET_SHEET_ID_FOOD:   ${{ secrets.HAPPYPET_SHEET_ID_FOOD }}
          HAPPYPET_SHEET_ID_TOYS:   ${{ secrets.HAPPYPET_SHEET_ID_TOYS }}
          HAPPYPET_SHEET_ID_HEALTH: ${{ secrets.HAPPYPET_SHEET_ID_HEALTH }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          set +e
          python3 post_pins.py --slugs "${{ steps.resolve.outputs.slugs }}" $FORCE_FLAG
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Push pins to Google Sheets
        if: steps.resolve.outputs.nothing_to_pin != 'true'
        env:
          FACEBOOK_QUEUE_SHEET_ID:  ${{ secrets.FACEBOOK_QUEUE_SHEET_ID }}
          GCP_SA_KEY_B64:           ${{ secrets.GCP_SA_KEY_B64 }}
        run: |
          python3 push_pins_to_sheets.py --slugs "${{ steps.resolve.outputs.slugs }}"

      - name: Consume pending-slugs
        if: steps.resolve.outputs.nothing_to_pin != 'true'
        run: |
          PENDING="_pin_queue/.pending-slugs"
          git pull --rebase --autostash origin main
          git add products.json _pin_queue/ 2>/dev/null || true
          if [ -f "$PENDING" ]; then
            git rm "$PENDING" -q
          fi
          if git diff --cached --quiet; then
            echo "Nothing staged — no commit needed"
          else
            git commit -m "chore: retire slug and consume pending-slugs after pin run"
            for attempt in 1 2 3 4 5; do
              if git push origin main; then echo "Pushed cleanup (attempt ${attempt})"; break; fi
              if [ "$attempt" = "5" ]; then echo "ERROR: push failed after 5 attempts"; exit 1; fi
              echo "Push rejected -- rebasing and retrying (attempt ${attempt})"
              git pull --rebase --autostash origin main
              sleep 3
            done
          fi

      - name: Fail the job if posting pins failed
        if: steps.post.outcome == 'failure'
        run: |
          if [ "${{ steps.post.outputs.rc }}" = "6" ]; then
            echo "::error::post_pins.py refused a repeat (exit 6): that image already went out on that board. Nothing failed and there is nothing to retry; to pin the post again, give it a new image path."
          else
            echo "::error::post_pins.py exited nonzero (failed or missing pin) -- see the post step's log"
          fi
          exit 1

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-logs-${{ github.run_id }}
          path: LOGS/
          if-no-files-found: ignore
          retention-days: 14

      - name: Alert on failure
        if: failure() && steps.resolve.outputs.nothing_to_pin != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUGS: ${{ steps.resolve.outputs.slugs }}
          LIVE: ${{ steps.liveness.outputs.live }}
          POSTED: ${{ steps.post.outcome }}
          RC: ${{ steps.post.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY=$(TZ=America/New_York date +%F)
          TITLE="⚠️ Pins failed on ${DAY}: ${SLUGS:-no slugs resolved}"
          TODO="What to do: read the failed step's log and fix the cause, then run pin.yml by hand with these slugs. Boards that already have the pin are skipped. Close this issue once the pins are out."
          if [ "$POSTED" = "failure" ] && [ "$RC" = "6" ]; then
            TITLE="⚠️ Pin repeat refused on ${DAY}: ${SLUGS:-no slugs resolved}"
            TODO="What to do: nothing to retry; running again with the same image is refused again. To pin the post again, give it a new image path, then run pin.yml with these slugs and force set to true. Close this issue once done, or now if no re-pin is wanted."
          fi
          # One issue per day and slug list. If the listing fails, open the issue
          # anyway. So too if a matching open issue lies beyond the first 200 listed
          # (--limit): it is missed and a duplicate is opened, by policy better than
          # a lost alert.
          OPEN=$(gh issue list --repo DMoneyOH/HappyPet --state open --limit 200 \
            --json title --jq '.[].title' || true)
          if grep -Fxq -- "$TITLE" <<< "$OPEN"; then
            echo "An issue is already open for these pins: ${TITLE}"
            exit 0
          fi
          if [ "$LIVE" = "false" ]; then
            WHAT="The articles or their pin images were not live after 30 minutes, so no pins were posted."
          elif [ "$POSTED" = "failure" ] && [ "$RC" = "6" ]; then
            WHAT="post_pins.py refused to re-pin an image that already went out on its boards (exit 6). Nothing failed."
          elif [ "$POSTED" = "failure" ]; then
            WHAT="post_pins.py reported a failed or missing pin."
          else
            WHAT="A step failed before or after posting; the run log names it."
          fi
          REPORTED=$(TZ=America/New_York date '+%a %b %-d, %Y %-I:%M %p %Z')
          BODY=$(printf '%s\n' \
            "Stage 3 (pin.yml) failed for: ${SLUGS:-no slugs resolved}. ${WHAT}" \
            "" \
            "Reported: ${REPORTED}" \
            "Run: ${RUN_URL}" \
            "" \
            "${TODO}" \
            "" \
            "_Auto-generated by pin.yml_")
          gh issue create \
            --repo DMoneyOH/HappyPet \
            --title "$TITLE" \
            --body "$BODY" \
            --assignee DMoneyOH
